[project]
name = "ragbot"
version = "0.1.0"
description = "Agentic RAG chatbot demo: LangGraph + Claude + FAISS over a fictional company knowledge base."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2",
    "anthropic>=0.40",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "streamlit>=1.38",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
