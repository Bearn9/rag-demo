name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Rebuild vector store
        run: python -m ragbot.ingest
        env:
          PYTHONPATH: src

      - name: Retrieval quality gate (no API key needed)
        run: python scripts/run_eval.py --retrieval-only --min-hit-at-4 0.9

      - name: Run tests
        run: pytest -v
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
